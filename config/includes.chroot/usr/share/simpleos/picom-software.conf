# Simple OS – picom ohne Hardware-OpenGL (nur llvmpipe/Software-Rendering, z.B. VM ohne 3D-Beschleunigung).
# simpleos-picom startet diese Datei statt ~/.config/picom/picom.conf: Schatten, Blenden und runde Ecken würden
# hier jedes Bild auf der CPU berechnen (picom lag damit bei ~55 % CPU). Der Compositor bleibt trotzdem an,
# damit transparente Ecken (Rofi, Taskleiste, Meldungen) nicht schwarz werden.
backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = false;
shadow = false;
fading = false;
corner-radius = 0;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
detect-transient = true;
