# Simple OS – picom without hardware OpenGL (only llvmpipe/software rendering, e.g. a VM without 3D acceleration).
# simpleos-picom starts this file instead of ~/.config/picom/picom.conf: shadows, fades and rounded corners would
# compute every frame on the CPU here (picom used ~55 % CPU with them). The compositor still stays on,
# so transparent corners (Rofi, taskbar, notifications) do not turn black.
backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = false;
shadow = false;
fading = false;
corner-radius = 0;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
detect-transient = true;
