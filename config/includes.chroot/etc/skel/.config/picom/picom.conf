# Simple OS – picom: kurze, sparsame Blenden für Fenster; Menüs, Rofi, Tooltips und Taskleiste erscheinen sofort.
# GLX: GPU-Compositing, mit VSync reißfrei. Ohne Hardware-OpenGL (nur llvmpipe/Software-Rendering, z.B. VM ohne
# 3D) startet simpleos-picom stattdessen /usr/share/simpleos/picom-software.conf (xrender, ohne Schatten/Blenden).
backend = "glx";
vsync = true;
# Nur geänderte Bereiche neu zeichnen statt bei jeder Änderung den ganzen Bildschirm
use-damage = true;
# Intel & Co.: kein Stencil-Buffer (spart GPU-Speicher/-Arbeit), Pixmaps nicht bei jedem Frame neu binden
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
# Unredirect (Vollbild-Spiele/-Videos ohne Compositor: weniger Latenz, kein doppeltes VSync) schaltet
# simpleos-picom auf echter Hardware per --unredir-if-possible ein. Hier aus: unter QEMU/virtio verschwand
# sonst der Mauszeiger bzw. glitchte.
unredir-if-possible = false;

# Schatten: groß und weich, leicht nach unten versetzt (Fenster schweben über dem Wallpaper)
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.35;
shadow-offset-x = -20;
shadow-offset-y = -14;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  # Rofi zeichnet seine runden Ecken selbst; picom 9.1 zeichnet Schatten nur rechteckig – der schiene durch die Ecken
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c",
  # Browser: kein Schatten beim Öffnen/Resize (Debian: WM_CLASS "firefox-esr")
  "class_g = 'firefox-esr'",
  "class_g = 'firefox'",
  "class_g = 'Firefox'",
  "class_g = 'Chromium'"
];

# Abgerundete Ecken (Rofi, Taskleiste und Meldungen zeichnen ihre Ecken selbst). Menüs (Openbox-Rechtsklick,
# GTK-Kontextmenüs) werden mit abgerundet: zusammen mit dem Schatten ersetzt das die harte, eckige Kontur.
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'Rofi'"
];

# Fading: kurz und günstig (GPU-Blend, ~50 ms ein, ~40 ms aus) – nur Fenster und Meldungen. Menüs, Rofi
# (Startmenü/Suche/Flyouts), Tooltips und Taskleiste bleiben ohne Blende, damit nichts träge wirkt.
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.12;
fade-delta = 5;
no-fading-openclose = false;
no-fading-destroyed-argb = true;
fade-exclude = [
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'tooltip'"
];

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

wintypes:
{
  tooltip = { fade = false; shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.97; fade = false; };
  dropdown_menu = { opacity = 0.97; fade = false; };
};
