# Simple OS – picom: short, sparing fades for windows; menus, Rofi, tooltips and the taskbar appear immediately.
# GLX: GPU compositing, tear-free with VSync. Without hardware OpenGL (only llvmpipe/software rendering, e.g. a VM
# without 3D) simpleos-picom starts /usr/share/simpleos/picom-software.conf instead (xrender, no shadows/fades).
backend = "glx";
vsync = true;
# Only redraw changed areas instead of the whole screen on every change
use-damage = true;
# Intel & co.: no stencil buffer (saves GPU memory/work), do not rebind pixmaps on every frame
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
# Unredirect (full-screen games/videos without the compositor: less latency, no double VSync) is switched on
# by simpleos-picom on real hardware with --unredir-if-possible. Off here: under QEMU/virtio the mouse pointer
# disappeared or glitched otherwise.
unredir-if-possible = false;

# Shadows: large and soft, slightly offset downwards (windows float above the wallpaper)
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.35;
shadow-offset-x = -20;
shadow-offset-y = -14;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  # Rofi draws its rounded corners itself; picom 9.1 only draws rectangular shadows – they would show through the corners
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c",
  # Browser: no shadow while opening/resizing (Debian: WM_CLASS "firefox-esr")
  "class_g = 'firefox-esr'",
  "class_g = 'firefox'",
  "class_g = 'Firefox'",
  "class_g = 'Chromium'"
];

# Rounded corners (Rofi, the taskbar and notifications draw their corners themselves). Menus (Openbox right-click,
# GTK context menus) are rounded too: together with the shadow this replaces the hard, square outline.
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'Rofi'"
];

# Fading: short and cheap (GPU blend, ~50 ms in, ~40 ms out) – only windows and notifications. Menus, Rofi
# (start menu/search/flyouts), tooltips and the taskbar stay without fades so nothing feels sluggish.
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.12;
fade-delta = 5;
no-fading-openclose = false;
no-fading-destroyed-argb = true;
fade-exclude = [
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'tooltip'"
];

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

wintypes:
{
  tooltip = { fade = false; shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.97; fade = false; };
  dropdown_menu = { opacity = 0.97; fade = false; };
};
