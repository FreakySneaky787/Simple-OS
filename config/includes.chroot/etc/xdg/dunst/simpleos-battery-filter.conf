
# ---- Simple OS – battery filter ---------------------------------------------------------------------------
# Appended to the end of the dunst configuration by /usr/local/bin/simpleos-dunst – only in VMs
# (systemd-detect-virt --vm) or when "simpleos-battery --present" fails (no real battery).
# dunst 1.9 has no drop-ins and no conditional rules, hence the detour via the launcher.
# Rules apply in order (after [urgency_*]); format = "" discards the notification ("Skipping
# notification"), history_ignore keeps it out of the history. Patterns = shell globs (no enable_posix_regex).
# Exception at the very bottom: Simple OS's own notifications (category x-simpleos, e.g. power menu) stay visible.
# Exactly "x-simpleos", no glob: "x-simpleos*" also caught the OSD bars (x-simpleos-osd) and overrode their
# rule [simpleos-osd] (one line, not in the history) – OSDs became two lines and filled the history.
[simpleos-drop-battery-summary]
    summary = "*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-body]
    body = "*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*"
    format = ""
    history_ignore = yes
[simpleos-drop-akku-summary]
    summary = "*[Aa][Kk][Kk][Uu]*"
    format = ""
    history_ignore = yes
[simpleos-drop-akku-body]
    body = "*[Aa][Kk][Kk][Uu]*"
    format = ""
    history_ignore = yes
[simpleos-drop-power-summary]
    summary = "*[Pp][Oo][Ww][Ee][Rr]*"
    format = ""
    history_ignore = yes
[simpleos-drop-power-body]
    body = "*[Pp][Oo][Ww][Ee][Rr]*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-icon]
    icon = "*battery*"
    format = ""
    history_ignore = yes
[simpleos-drop-power-apps]
    appname = "*[Pp]ower*"
    format = ""
    history_ignore = yes
[simpleos-drop-upower]
    appname = "*[Uu][Pp]ower*"
    format = ""
    history_ignore = yes
[simpleos-drop-cbatticon]
    appname = "*batt*"
    format = ""
    history_ignore = yes
[simpleos-keep-own]
    category = "x-simpleos"
    format = "<b>%s</b>\n%b"
    history_ignore = no
