
# ---- Simple OS – Akku-Filter --------------------------------------------------------------------------
# Wird von /usr/local/bin/simpleos-dunst ans Ende der dunst-Konfiguration gehängt – nur in VMs
# (systemd-detect-virt --vm) bzw. wenn "simpleos-battery --present" fehlschlägt (kein echter Akku).
# dunst 1.9 kennt keine Drop-ins und keine bedingten Regeln, daher der Umweg über den Starter.
# Regeln gelten der Reihe nach (nach [urgency_*]); format = "" verwirft die Meldung ("Skipping
# notification"), history_ignore hält sie aus dem Verlauf. Muster = Shell-Globs (kein enable_posix_regex).
# Ausnahme ganz unten: eigene Simple-OS-Meldungen (Kategorie x-simpleos, z.B. Power-Menü) bleiben sichtbar.
[simpleos-drop-battery-summary]
    summary = "*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-body]
    body = "*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*"
    format = ""
    history_ignore = yes
[simpleos-drop-akku-summary]
    summary = "*[Aa][Kk][Kk][Uu]*"
    format = ""
    history_ignore = yes
[simpleos-drop-akku-body]
    body = "*[Aa][Kk][Kk][Uu]*"
    format = ""
    history_ignore = yes
[simpleos-drop-power-summary]
    summary = "*[Pp][Oo][Ww][Ee][Rr]*"
    format = ""
    history_ignore = yes
[simpleos-drop-power-body]
    body = "*[Pp][Oo][Ww][Ee][Rr]*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-icon]
    icon = "*battery*"
    format = ""
    history_ignore = yes
[simpleos-drop-power-apps]
    appname = "*[Pp]ower*"
    format = ""
    history_ignore = yes
[simpleos-drop-upower]
    appname = "*[Uu][Pp]ower*"
    format = ""
    history_ignore = yes
[simpleos-drop-cbatticon]
    appname = "*batt*"
    format = ""
    history_ignore = yes
[simpleos-keep-own]
    category = "x-simpleos*"
    format = "<b>%s</b>\n%b"
    history_ignore = no
