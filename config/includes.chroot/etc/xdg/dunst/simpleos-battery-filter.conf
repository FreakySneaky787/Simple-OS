
# ---- Simple OS – battery filter ---------------------------------------------------------------------------
# Appended to the end of the dunst configuration by /usr/local/bin/simpleos-dunst – only in VMs
# (systemd-detect-virt --vm) or when "simpleos-battery --present" fails (no real battery).
# dunst 1.9 has no drop-ins and no conditional rules, hence the detour via the launcher.
# Rules apply in order (after [urgency_*]); format = "" discards the notification ("Skipping
# notification"), history_ignore keeps it out of the history. Patterns = shell globs (no enable_posix_regex).
# What is discarded: (1) notifications of power/battery programs (by sender name), (2) notifications with a battery icon,
# (3) warning TEXTS ("battery low", "Akku schwach" …) – but only from plain "notify-send" callers: a chat message, a mail
# or a download that merely mentions battery or power ("my phone battery is empty", "Power bill", "PowerPoint.pptx")
# must never disappear on a desktop PC. All conditions of a rule must match.
# Exception at the very bottom: Simple OS's own notifications (category x-simpleos, e.g. power menu) stay visible.
# Exactly "x-simpleos", no glob: "x-simpleos*" also caught the OSD bars (x-simpleos-osd) and overrode their
# rule [simpleos-osd] (one line, not in the history) – OSDs became two lines and filled the history.
[simpleos-drop-power-apps]
    appname = "*[Pp]ower*"
    format = ""
    history_ignore = yes
[simpleos-drop-upower]
    appname = "*[Uu][Pp]ower*"
    format = ""
    history_ignore = yes
[simpleos-drop-cbatticon]
    appname = "*batt*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-icon]
    icon = "*battery*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-low-summary]
    appname = "notify-send"
    summary = "*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*[Ll][Oo][Ww]*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-low-body]
    appname = "notify-send"
    body = "*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*[Ll][Oo][Ww]*"
    format = ""
    history_ignore = yes
[simpleos-drop-low-battery-summary]
    appname = "notify-send"
    summary = "*[Ll][Oo][Ww]*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*"
    format = ""
    history_ignore = yes
[simpleos-drop-low-battery-body]
    appname = "notify-send"
    body = "*[Ll][Oo][Ww]*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-critical-summary]
    appname = "notify-send"
    summary = "*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*[Cc][Rr][Ii][Tt][Ii][Cc][Aa][Ll]*"
    format = ""
    history_ignore = yes
[simpleos-drop-battery-critical-body]
    appname = "notify-send"
    body = "*[Bb][Aa][Tt][Tt][Ee][Rr][Yy]*[Cc][Rr][Ii][Tt][Ii][Cc][Aa][Ll]*"
    format = ""
    history_ignore = yes
[simpleos-drop-akku-summary]
    appname = "notify-send"
    summary = "*[Aa][Kk][Kk][Uu]*[Ss][Cc][Hh][Ww][Aa][Cc][Hh]*"
    format = ""
    history_ignore = yes
[simpleos-drop-akku-body]
    appname = "notify-send"
    body = "*[Aa][Kk][Kk][Uu]*[Ss][Cc][Hh][Ww][Aa][Cc][Hh]*"
    format = ""
    history_ignore = yes
[simpleos-drop-akku-leer-summary]
    appname = "notify-send"
    summary = "*[Aa][Kk][Kk][Uu]*[Kk][Rr][Ii][Tt][Ii][Ss][Cc][Hh]*"
    format = ""
    history_ignore = yes
[simpleos-drop-akku-leer-body]
    appname = "notify-send"
    body = "*[Aa][Kk][Kk][Uu]*[Kk][Rr][Ii][Tt][Ii][Ss][Cc][Hh]*"
    format = ""
    history_ignore = yes
[simpleos-drop-low-power-summary]
    appname = "notify-send"
    summary = "*[Ll][Oo][Ww]*[Pp][Oo][Ww][Ee][Rr]*"
    format = ""
    history_ignore = yes
[simpleos-drop-low-power-body]
    appname = "notify-send"
    body = "*[Ll][Oo][Ww]*[Pp][Oo][Ww][Ee][Rr]*"
    format = ""
    history_ignore = yes
[simpleos-keep-own]
    category = "x-simpleos"
    format = "<b>%s</b>\n%b"
    history_ignore = no
