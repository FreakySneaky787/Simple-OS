# Simple OS: list other systems (Windows, other Linux) in the GRUB menu – GRUB 2.06 switches os-prober off by default.
# Here and not in /etc/default/grub: every GRUB update from Debian rewrites the os-prober line there (the grub-pc /
# grub-efi-amd64 scripts turn any GRUB_DISABLE_OS_PROBER line into "off"), so other systems vanished from the menu.
# grub-mkconfig reads this file after /etc/default/grub. To hide other systems: set "true" here, then run update-grub.
GRUB_DISABLE_OS_PROBER=false
