# Simple OS – broadcom-sta-dkms (Broadcom-WLAN "wl", z.B. BCM4360) mit Kernel 6.12 aus Backports bauen.
# Das Bookworm-Paket kennt 6.12 noch nicht: dort heißt <asm/unaligned.h> jetzt <linux/unaligned.h>. DKMS liest
# diese Datei nach dem dkms.conf des Pakets; geändert wird nur die Arbeitskopie unter /var/lib/dkms (das Paket
# bleibt unverändert). Die Arbeitskopie teilen sich alle Kernel -> je nach Ziel-Kernel in BEIDE Richtungen setzen
# (neuer Header vorhanden: linux/unaligned.h, sonst wieder asm/unaligned.h).
# Ohne eigene Shell-Variablen: DKMS wertet den Befehl zweimal aus (nur $kernelver ist sicher).
MAKE[0]="if [ -e /usr/src/linux-headers-${kernelver%-*}-common/include/linux/unaligned.h ] || [ -e /lib/modules/$kernelver/build/include/linux/unaligned.h ]; then sed -i 's#<asm/unaligned.h>#<linux/unaligned.h>#' src/wl/sys/wl_linux.c; else sed -i 's#<linux/unaligned.h>#<asm/unaligned.h>#' src/wl/sys/wl_linux.c; fi; make KVER=$kernelver"
