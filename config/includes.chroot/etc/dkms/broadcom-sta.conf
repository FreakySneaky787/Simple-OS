# Simple OS – build broadcom-sta-dkms (Broadcom Wi-Fi "wl", e.g. BCM4360) with kernel 6.12 from backports.
# The Bookworm package does not know 6.12 yet: <asm/unaligned.h> is now called <linux/unaligned.h>. DKMS reads
# this file after the package's dkms.conf; only the working copy under /var/lib/dkms is changed (the package
# stays unchanged). All kernels share the working copy -> set it in BOTH directions depending on the target kernel
# (new header present: linux/unaligned.h, otherwise asm/unaligned.h again).
# No shell variables of our own: DKMS evaluates the command twice (only $kernelver is safe).
MAKE[0]="if [ -e /usr/src/linux-headers-${kernelver%-*}-common/include/linux/unaligned.h ] || [ -e /lib/modules/$kernelver/build/include/linux/unaligned.h ]; then sed -i 's#<asm/unaligned.h>#<linux/unaligned.h>#' src/wl/sys/wl_linux.c; else sed -i 's#<linux/unaligned.h>#<asm/unaligned.h>#' src/wl/sys/wl_linux.c; fi; make KVER=$kernelver"
