# Simple OS – last page of the installer (replaces the file from calamares-settings-debian).
# "Restart now" is ticked; the restart goes through simpleos-installer-restart, which first asks to remove the USB stick
# (or disc) – otherwise the computer may start the live system again – and then restarts safely without it.
---
restartNowEnabled: true
restartNowChecked: true
restartNowCommand: "/usr/local/sbin/simpleos-installer-restart"
notifyOnFinished: false
