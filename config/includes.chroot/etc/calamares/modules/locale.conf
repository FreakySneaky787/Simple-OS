# Simple OS – the installer's "Location" page (Calamares locale module, #160).
# Debian's package brings no locale.conf, so Calamares started at its built-in America/New_York: a German person had to
# find Berlin in the list (clicking Germany on the map picked Copenhagen and Danish number formats). Now Europe/Berlin
# is preselected. No GeoIP on purpose: it would send the computer's IP address to an outside server during the
# installation. Region/zone can be changed as before.
---
region: "Europe"
zone: "Berlin"
