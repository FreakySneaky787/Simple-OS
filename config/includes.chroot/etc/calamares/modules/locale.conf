# Simple OS – the installer's "Location" page (Calamares locale module, #160).
# Debian's package brings no locale.conf, so Calamares started at its built-in America/New_York: a German person had to
# find Berlin in the list (clicking Germany on the map picked Copenhagen and Danish number formats). Now the location
# comes from GeoIP (one request to KDE's GeoIP service, as in KDE neon and other Calamares systems; only the time zone
# is used, nothing is stored) and without internet Europe/Berlin is selected. Region/zone can be changed as before.
---
region: "Europe"
zone: "Berlin"
geoip:
    style: "json"
    url: "https://geoip.kde.org/v1/calamares"
    selector: ""
