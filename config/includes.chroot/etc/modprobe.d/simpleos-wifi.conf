# Simple OS – power saving of Wi-Fi drivers with known drops to a few kB/s or connection losses
# (Realtek RTL8852/8851/8922 = rtw89, RTL8821/8822 = rtw88, MediaTek MT7921/MT7922 = mt7921e – common in Lenovo
# IdeaPad/ThinkBook laptops). Switched off: PCIe power saving states (ASPM/CLKREQ) and the firmware's low power
# mode. Only takes effect if exactly this driver is loaded – Intel (iwlwifi) and other chips stay unchanged.
# Costs a little battery (usually under 0.5 W). Check: modprobe -c | grep -E 'rtw8|mt7921'
options rtw89_core disable_ps_mode=y
options rtw89_pci disable_clkreq=y disable_aspm_l1=y disable_aspm_l1ss=y
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_aspm=y
options mt7921e disable_aspm=y
