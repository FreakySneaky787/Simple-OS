# Simple OS – Stromsparen der WLAN-Treiber mit bekannten Einbrüchen auf wenige kB/s bzw. Verbindungsabrissen
# (Realtek RTL8852/8851/8922 = rtw89, RTL8821/8822 = rtw88, MediaTek MT7921/MT7922 = mt7921e – häufig in Lenovo-
# IdeaPad/ThinkBook-Laptops). Ausgeschaltet werden PCIe-Stromsparzustände (ASPM/CLKREQ) und der Low-Power-Modus der
# Firmware. Wirkt nur, wenn genau dieser Treiber geladen ist – Intel (iwlwifi) und andere Chips bleiben unverändert.
# Kostet etwas Akku (meist unter 0,5 W). Prüfen: modprobe -c | grep -E 'rtw8|mt7921'
options rtw89_core disable_ps_mode=y
options rtw89_pci disable_clkreq=y disable_aspm_l1=y disable_aspm_l1ss=y
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_aspm=y
options mt7921e disable_aspm=y
