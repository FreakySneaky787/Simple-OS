<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Simple OS – systemweite Schriften: Inter für Oberfläche und Texte, JetBrains Mono für Code/Terminal.
     Gilt auch für Programme, die nur "sans-serif" anfordern (Browser, WebKit, Qt). Cantarell als Ausweich,
     DejaVu für fehlende Zeichen, Noto Color Emoji für Emoji. Darstellung: Kantenglättung mit RGB-Subpixeln
     (schärfer auf den üblichen LCD-Panels, wie ClearType unter Windows), leichtes Hinting, LCD-Filter gegen
     Farbsäume. Wer ein BGR-/OLED-/gedrehtes Panel hat und Farbsäume sieht: rgba auf "none" stellen. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Cantarell</family><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family><family>Cantarell</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Serif</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
