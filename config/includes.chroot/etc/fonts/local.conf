<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Simple OS – system-wide fonts: Inter for the interface and texts, JetBrains Mono for code/terminal.
     Also applies to programs that only ask for "sans-serif" (browsers, WebKit, Qt). Cantarell as fallback,
     DejaVu for missing characters, Noto Color Emoji for emoji. Rendering: antialiasing with RGB subpixels
     (sharper on the usual LCD panels, like ClearType on Windows), slight hinting, LCD filter against
     color fringes. If you have a BGR/OLED/rotated panel and see color fringes: set rgba to "none". -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Cantarell</family><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family><family>Cantarell</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Serif</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
