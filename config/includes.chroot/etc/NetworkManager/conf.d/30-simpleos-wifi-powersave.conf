# Simple OS – WLAN-Stromsparmodus aus. Mit Stromsparen (Vorgabe der meisten Treiber) brach die Verbindung immer
# wieder auf wenige kB/s ein, während dasselbe Netz unter Windows normal lief: der Chip "schläft" zwischen den
# Paketen und verpasst/verzögert Daten. Kostet meist weniger als ein halbes Watt Akku.
# Gilt für alle WLAN-Verbindungen ohne eigene Einstellung (wifi.powersave = 0 "default" im Profil).
# Prüfen: NetworkManager --print-config | grep -A2 simpleos-wifi-powersave
[connection-simpleos-wifi-powersave]
match-device=type:wifi
wifi.powersave=2
