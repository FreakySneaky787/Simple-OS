# Simple OS – Wi-Fi power saving off. With power saving (the default of most drivers) the connection kept
# dropping to a few kB/s, while the same network ran normally under Windows: the chip "sleeps" between
# packets and misses/delays data. Usually costs less than half a watt of battery.
# Applies to all Wi-Fi connections without their own setting (wifi.powersave = 0 "default" in the profile).
# Check: NetworkManager --print-config | grep -A2 simpleos-wifi-powersave
[connection-simpleos-wifi-powersave]
match-device=type:wifi
wifi.powersave=2
