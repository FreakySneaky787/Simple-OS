# Simple OS – Routen-Priorität: das Kabel (Ethernet) ist immer die primäre Route (Metrik 100), WLAN folgt
# mit 600 – wie bei Windows gewinnt die kabelgebundene Verbindung. Feste Werte statt NetworkManagers
# Automatik, damit virtuelle/simulierte Netze (VMs, Container-Brücken, Tests) die Standardroute nicht
# übernehmen. Gilt für alle Verbindungen ohne eigene Metrik (ipv4.route-metric = -1).
[connection-simpleos-ethernet]
match-device=type:ethernet
ipv4.route-metric=100
ipv6.route-metric=100

[connection-simpleos-wifi]
match-device=type:wifi
ipv4.route-metric=600
ipv6.route-metric=600
