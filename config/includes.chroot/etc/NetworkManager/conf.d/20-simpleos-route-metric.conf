# Simple OS – route priority: the cable (Ethernet) is always the primary route (metric 100), Wi-Fi follows
# with 600 – like on Windows, the wired connection wins. Fixed values instead of NetworkManager's
# automatic choice, so virtual/simulated networks (VMs, container bridges, tests) do not take over the default
# route. Applies to all connections without their own metric (ipv4.route-metric = -1).
[connection-simpleos-ethernet]
match-device=type:ethernet
ipv4.route-metric=100
ipv6.route-metric=100

[connection-simpleos-wifi]
match-device=type:wifi
ipv4.route-metric=600
ipv6.route-metric=600
