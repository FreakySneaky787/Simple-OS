# Simple OS – desktop performance
# Swap is zram (compressed RAM, /etc/default/zramswap, priority 100): moving a rarely used page there costs a little CPU,
# dropping file cache and reading it from disk again costs far more. So swap early (kernel default: 60; up to 200 allowed)
# and read swap pages one at a time (page-cluster 0 instead of 8 neighbours: right for zram, no readahead needed).
# Under memory pressure this keeps the desktop responsive until earlyoom steps in.
vm.swappiness = 100
vm.page-cluster = 0
# Keep directory and inode caches longer -> file manager and app starts respond faster (default: 100)
vm.vfs_cache_pressure = 50
# Write buffers to disk earlier -> no long stalls when copying large files
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Games (Proton/Wine) and large programs need many memory mappings (default: 65530)
vm.max_map_count = 1048576
