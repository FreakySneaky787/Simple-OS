# Simple OS – Desktop-Performance
# RAM statt Swap/zram nutzen, solange genug frei ist (Standard: 60)
vm.swappiness = 10
# Verzeichnis- und Inode-Caches länger behalten -> Dateimanager und App-Starts reagieren schneller (Standard: 100)
vm.vfs_cache_pressure = 50
# Schreibpuffer früher auf die Platte bringen -> keine langen Hänger beim Kopieren großer Dateien
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Spiele (Proton/Wine) und große Programme brauchen viele Speicherbereiche (Standard: 65530)
vm.max_map_count = 1048576
# Netzwerk: moderner Paket-Scheduler gegen Verzögerungen bei voller Leitung
net.core.default_qdisc = fq_codel
