# Simple OS – the system log may not grow without limit: journald's default is 10 % of the disk (up to 4 GB), which
# on a small SSD is a lot for logs nobody reads. 200 MB cover weeks of normal use ("Report a Problem" needs only
# the last boots); in RAM (live session) 50 MB.
[Journal]
SystemMaxUse=200M
RuntimeMaxUse=50M
