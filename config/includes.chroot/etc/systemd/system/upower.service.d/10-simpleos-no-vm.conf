# Simple OS – no UPower in VMs: QEMU & co. sometimes report a virtual power device with 0 %. UPower 0.99
# cannot ignore individual devices (UPower.conf has no option for it) and would trigger the CriticalPowerAction
# (HybridSleep -> Hibernate -> PowerOff) for an "empty" phantom battery; programs that ask UPower would
# be told about the phantom battery. Real computers (laptop battery, UPS on a desktop) are not affected.
[Unit]
ConditionVirtualization=!vm
