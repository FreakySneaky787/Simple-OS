# Simple OS – UPower nicht in VMs: QEMU & Co. melden teils ein virtuelles Power-Device mit 0 %. UPower 0.99
# kann einzelne Geräte nicht ignorieren (UPower.conf kennt dafür keine Option) und würde bei einem "leeren"
# Phantom-Akku die CriticalPowerAction (HybridSleep -> Hibernate -> PowerOff) auslösen; Programme, die UPower
# fragen, bekämen den Phantom-Akku gemeldet. Echte Rechner (Laptop-Akku, USV am Desktop) sind nicht betroffen.
[Unit]
ConditionVirtualization=!vm
