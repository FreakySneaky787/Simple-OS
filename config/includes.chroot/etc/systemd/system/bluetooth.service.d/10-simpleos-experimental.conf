# Simple OS: BlueZ's experimental D-Bus interfaces – among them the battery provider through which PipeWire reports
# the battery level of Bluetooth headphones (Control Center → Bluetooth, the Bluetooth flyout). Without it WirePlumber
# logs "BlueZ Battery Provider is not available" and the level never shows. Same as "Experimental = true" in
# /etc/bluetooth/main.conf, without changing bluez's own config file. Takes effect at the next start.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental
