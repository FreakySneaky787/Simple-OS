# Simple OS – closing the laptop lid = sleep, also on AC power. With an external screen (docked)
# it stays awake. xfce4-power-manager leaves the lid to logind (logind-handle-lid-switch,
# /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml) – otherwise it would decide itself and
# by default only turn off the screen on AC power. The session is locked before every sleep by
# /usr/lib/systemd/system-sleep/simpleos-lock (after opening the lid the login screen is in front).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
