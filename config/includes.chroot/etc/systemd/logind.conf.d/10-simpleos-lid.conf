# Simple OS – Laptop zuklappen = Energiesparmodus, auch am Netzteil. Mit externem Bildschirm (angedockt)
# bleibt er wach. xfce4-power-manager überlässt den Deckel logind (logind-handle-lid-switch,
# /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml) – sonst entschiede er selbst und
# würde am Netzteil standardmäßig nur den Bildschirm ausschalten. Gesperrt wird vor jedem Schlafen durch
# /usr/lib/systemd/system-sleep/simpleos-lock (nach dem Aufklappen ist der Anmeldebildschirm vorne).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
