# Simple OS – use newly connected audio devices (Bluetooth headset, HDMI, USB) right away as output/input,
# running playback moves along (like on Windows). module-switch-on-connect of pipewire-pulse (PipeWire 0.3.65);
# "nofail": if the module is missing, sound still starts. Back again when disconnecting: WirePlumber picks the previous one.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect" flags = [ "nofail" ] }
]
