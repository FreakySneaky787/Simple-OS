# Simple OS – neu angeschlossene Audiogeräte (Bluetooth-Headset, HDMI, USB) sofort als Ausgabe/Eingabe nutzen,
# laufende Wiedergaben ziehen mit (wie bei Windows). module-switch-on-connect von pipewire-pulse (PipeWire 0.3.65);
# "nofail": fehlt das Modul, startet der Ton trotzdem. Wieder zurück beim Trennen: WirePlumber wählt das vorige.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect" flags = [ "nofail" ] }
]
