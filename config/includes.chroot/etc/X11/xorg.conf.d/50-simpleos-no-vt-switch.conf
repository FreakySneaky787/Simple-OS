# Simple OS – no Ctrl+Alt+F1…F12 in the X servers (sessions and the login/lock screen).
# The lock screen is LightDM's greeter on its own VT next to the locked session ("dm-tool lock", simpleos-power
# --lock-now): with VT switching on, Ctrl+Alt+F7 at the lock screen went straight back to the unlocked desktop, and after
# "Switch user" the other account could do the same. LightDM itself still switches (lock, unlock, switch user) – it
# asks logind, not the keyboard. Text consoles are not reachable from the desktop any more; Simple OS needs none.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
EndSection
