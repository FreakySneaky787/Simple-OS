# Simple OS – input devices (driver: libinput, assigned in /usr/share/X11/xorg.conf.d/40-libinput.conf)
# Mouse: flat profile = no acceleration, the pointer follows 1:1
Section "InputClass"
    Identifier "simpleos-pointer"
    MatchIsPointer "on"
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0"
EndSection

# Touchpad: adaptive (overrides the mouse profile), tap = click, two-finger scrolling in the "natural"
# direction (content follows the fingers, like Windows Precision touchpads and macOS). Mouse wheels stay classic
# (own section above, MatchIsTouchpad does not match them).
Section "InputClass"
    Identifier "simpleos-touchpad"
    MatchIsTouchpad "on"
    Option "AccelProfile" "adaptive"
    Option "Tapping" "on"
    Option "ScrollMethod" "twofinger"
    Option "NaturalScrolling" "true"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "on"
EndSection
