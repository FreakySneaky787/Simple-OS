# Simple OS – Eingabegeräte (Treiber: libinput, zugewiesen in /usr/share/X11/xorg.conf.d/40-libinput.conf)
# Maus: flaches Profil = keine Beschleunigung, Zeiger folgt 1:1
Section "InputClass"
    Identifier "simpleos-pointer"
    MatchIsPointer "on"
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0"
EndSection

# Touchpad: adaptiv (überschreibt das Maus-Profil), Tippen = Klicken, Zwei-Finger-Scrollen in "natürlicher"
# Richtung (Inhalt folgt den Fingern, wie bei Windows-Precision-Touchpads und macOS). Mausräder bleiben klassisch
# (eigene Section oben, MatchIsTouchpad trifft sie nicht).
Section "InputClass"
    Identifier "simpleos-touchpad"
    MatchIsTouchpad "on"
    Option "AccelProfile" "adaptive"
    Option "Tapping" "on"
    Option "ScrollMethod" "twofinger"
    Option "NaturalScrolling" "true"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "on"
EndSection
