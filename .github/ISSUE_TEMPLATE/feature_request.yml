name: Idea / feature request
description: Suggest something new or better for Simple OS
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should Simple OS do or do differently?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What problem does it solve, or who would use it?
    validations:
      required: true
